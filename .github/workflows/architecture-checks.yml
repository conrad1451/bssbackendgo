name: Architecture Invariants

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "**/*.go"
      - "docs/**"
      - "scripts/architecture/**"

jobs:
  architecture-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make architecture scripts executable
        run: chmod +x scripts/architecture/*.sh

      - name: Dump database schema
        run: ./scripts/architecture/00_dump_schema.sh

      - name: Enforce architecture invariants
        run: ./scripts/architecture/run-all.sh
