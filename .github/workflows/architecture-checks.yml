name: Architecture Invariants

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "**/*.go"
      - "docs/**"
      - "scripts/architecture/**"

jobs:
  architecture-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Mitigate CVE-2026-31431 (Copy Fail) - remove once GitHub ships patched runner images
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          sudo rmmod algif_aead 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make architecture scripts executable
        run: chmod +x scripts/architecture/*.sh
        shell: bash

      - name: Dump database schema
        run: ./scripts/architecture/00_dump_schema.sh
        shell: bash

      - name: Enforce architecture invariants
        run: ./scripts/architecture/run-all.sh
        shell: bash
