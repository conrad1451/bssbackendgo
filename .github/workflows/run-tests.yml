name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Mitigate CVE-2026-31431 (Copy Fail) - remove once GitHub ships patched runner images
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          sudo rmmod algif_aead 2>/dev/null || true
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        env:
          NEON_DB_BSS: ${{ secrets.NEON_DB_BSS }}
        run: go test ./...
